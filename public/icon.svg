<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Gradient: Deep Night Obsidian Plum -->
    <linearGradient id="fretboardBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1325" />
      <stop offset="100%" stop-color="#0E0B14" />
    </linearGradient>

    <!-- Fret Wire Amber Gold Gradient -->
    <linearGradient id="fretGold" x1="8" y1="24" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5A836" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D4AD61" />
    </linearGradient>

    <!-- Subtle Golden Outer Halo Glow -->
    <radialGradient id="noteGlow" cx="24" cy="16" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AD61" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D4AD61" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Hairline Amber Border -->
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#fretboardBg)" stroke="#D4AD61" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Vertical Guitar Strings (Varying Guages: High to Low String) -->
  <line x1="14" y1="8" x2="14" y2="40" stroke="#F5F5F4" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round" />
  <line x1="24" y1="8" x2="24" y2="40" stroke="#F5F5F4" stroke-width="2.2" stroke-opacity="0.8" stroke-linecap="round" />
  <line x1="34" y1="8" x2="34" y2="40" stroke="#F5F5F4" stroke-width="3" stroke-opacity="1" stroke-linecap="round" />

  <!-- Horizontal Guitar Fret Wire -->
  <line x1="8" y1="25" x2="40" y2="25" stroke="url(#fretGold)" stroke-width="2.4" stroke-linecap="round" />

  <!-- Ambient Glow Behind Active Fret Note -->
  <circle cx="24" cy="16.5" r="7" fill="url(#noteGlow)" />

  <!-- Active Fret Note / Inlay Marker -->
  <circle cx="24" cy="16.5" r="3.2" fill="#D4AD61" />
  <circle cx="24" cy="16.5" r="1.4" fill="#FFF9EB" />
</svg>
